<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central Wallet - Dashboard</title>
<style>
/* 100% Local Styles - No External Links */
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
body { background: #000000; color: #ffffff; padding-bottom: 80px; display: flex; justify-content: center; min-height: 100vh; }
.container { width: 100%; max-width: 450px; background: #000000; padding: 15px; position: relative; }

/* Top Header */
.header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; margin-bottom: 10px; }
.app-name { font-size: 18px; font-weight: bold; color: #9d4edd; letter-spacing: 1px; }
.profile-icon { width: 38px; height: 38px; background: #9d4edd; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; cursor: pointer; border: 2px solid #222; font-size: 16px; }

/* Ad Banner */
.ad-box { width: 100%; height: 65px; background: #121212; border: 1px dashed #334155; border-radius: 10px; display: flex; justify-content: center; align-items: center; color: #475569; font-size: 11px; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; }

/* Dual Balance Row (Side-by-Side Cards) */
.balance-row { display: flex; gap: 10px; margin-bottom: 20px; }
.card { flex: 1; background: #121212; border: 1px solid #1c1c1c; padding: 14px; border-radius: 14px; text-align: left; }
.card p { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
.card h2 { font-size: 18px; color: #ffffff; font-weight: bold; display: flex; align-items: baseline; gap: 4px; }
.card h2 span { color: #9d4edd; font-size: 12px; font-weight: bold; }

/* Feature Grid */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.box { background: #121212; border: 1px solid #1c1c1c; padding: 15px; border-radius: 15px; text-align: center; cursor: pointer; transition: 0.2s; min-height: 90px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; }
.box:hover { border-color: #9d4edd; background: #161616; }
.icon { font-size: 22px; }
.label { font-size: 12px; font-weight: bold; color: #fff; }

/* Fixed Bottom Nav */
.footer-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 450px; background: #121212; border-top: 1px solid #1c1c1c; display: flex; justify-content: space-around; padding: 12px 0; z-index: 999; }
.nav-btn { background: none; border: none; color: #64748b; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-size: 10px; font-weight: bold; text-transform: uppercase; width: 20%; }
.nav-btn.active { color: #9d4edd; }
</style>
</head>
<body>

<div class="container">
    <!-- Header with Original Branding -->
    <div class="header">
        <div class="app-name">CENTRAL WALLET</div>
        <div class="profile-icon" id="user-logo" onclick="location.href='profile.html'">U</div>
    </div>

    <div class="ad-box">ADVERTISEMENT BANNER</div>

    <!-- Dual Balance Display -->
    <div class="balance-row">
        <!-- Left: n&n Wallet Coins -->
        <div class="card">
            <p>n&n Balance</p>
            <h2 id="wallet-bal">0.00 <span>n&n</span></h2>
        </div>
        <!-- Right: Dynamic Crypto (TON/USDT/Alpha) -->
        <div class="card">
            <p id="crypto-label">Crypto Balance</p>
            <h2 id="crypto-bal">0.00 <span id="crypto-symbol">XYZ</span></h2>
        </div>
    </div>

    <!-- Grid Features -->
    <div class="grid">
        <div class="box" onclick="location.href='p2p.html'">
            <div class="icon">📱</div>
            <div class="label">P2P Transfer</div>
        </div>
        <div class="box" onclick="location.href='game-pay.html'">
            <div class="icon">🎮</div>
            <div class="label">Game Pay</div>
        </div>
        <div class="box" onclick="location.href='deposit.html'">
            <div class="icon">➕</div>
            <div class="label">Deposit</div>
        </div>
        <div class="box" onclick="location.href='withdraw.html'">
            <div class="icon">➖</div>
            <div class="label">Withdraw</div>
        </div>
        <div class="box" onclick="location.href='swap-ton.html'">
            <div class="icon">🔄</div>
            <div class="label">Swap to TON</div>
        </div>
        <div class="box" onclick="location.href='swap-usdt.html'">
            <div class="icon">💵</div>
            <div class="label">Swap to USDT</div>
        </div>
    </div>
</div>

<div class="footer-nav">
    <button class="nav-btn active"><span style="font-size:18px">🏠</span><span>Home</span></button>
    <button class="nav-btn" onclick="location.href='search.html'"><span style="font-size:18px">🔍</span><span>Search</span></button>
    <button class="nav-btn" onclick="location.href='alerts.html'"><span style="font-size:18px">🔔</span><span>Alerts</span></button>
    <button class="nav-btn" onclick="location.href='history.html'"><span style="font-size:18px">📜</span><span>History</span></button>
</div>

<script>
// ⚡ Your Live Render Server Link
const API_URL = "https://central-wallet-game-api.onrender.com";

window.onload = async function() {
    const userUID = localStorage.getItem('user_uid');
    if (!userUID) {
        window.location.href = 'index.html';
        return;
    }
    await fetchLiveUserData(userUID);
};

async function fetchLiveUserData(uid) {
    try {
        const response = await fetch(`${API_URL}/api/wallet/balance?uid=${uid}`);
        const data = await response.json();
        
        if (data.success) {
            // Live Update for n&n Coins
            document.getElementById('wallet-bal').innerHTML = `${data.nn_balance.toFixed(2)} <span>n&n</span>`;
            
            // Live Update for n&n Alpha Crypto
            document.getElementById('crypto-bal').innerHTML = `${data.alpha_balance.toFixed(2)} <span>ALPHA</span>`;
        }
    } catch (err) {
        console.error("Dashboard Sync Failed:", err);
    }
}

</script>
</body>
</html>
