<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Wallet - Gaming Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 20px;
        }
        .auth-container {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 10px 5px;
        }
        .brand-header {
            text-align: left;
            margin-bottom: 35px;
            padding-left: 5px;
        }
        .brand-header h2 {
            color: #1a1a1a;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .brand-header p {
            color: #666666;
            font-size: 14px;
            margin-top: 6px;
            font-weight: 400;
        }
        .form-group {
            margin-bottom: 24px;
            position: relative;
            width: 100%;
        }
        .form-row {
            display: flex;
            gap: 15px;
            width: 100%;
        }
        .form-row .form-group {
            flex: 1;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #5f259f;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }
        .input-wrapper input {
            width: 100%;
            padding: 12px 10px 8px 5px;
            border: none;
            border-bottom: 1.5px solid #cccccc;
            font-size: 16px;
            color: #222222;
            outline: none;
            transition: all 0.2s ease;
            background-color: transparent;
            font-weight: 500;
        }
        .input-wrapper input:focus {
            border-bottom: 2px solid #5f259f;
        }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: #5f259f;
            border: none;
            border-radius: 25px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 15px;
        }
        .switch-form-text {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #444444;
        }
        .switch-form-text a {
            color: #5f259f;
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
        }
        .hidden {
            display: none !important;
        }
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
        }
        .popup-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .popup-box {
            background: #ffffff;
            padding: 30px 24px;
            border-radius: 16px;
            text-align: center;
            max-width: 340px;
            width: 85%;
            transform: translateY(20px);
            transition: all 0.25s ease;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .popup-icon-container {
            width: 50px;
            height: 50px;
            margin: 0 auto 14px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .popup-title {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 8px;
        }
        .popup-message {
            font-size: 14px;
            color: #555555;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .popup-btn {
            width: 100%;
            padding: 13px;
            background: #5f259f;
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- LOGIN BOX -->
        <div id="login-box">
            <div class="brand-header">
                <h2>Welcome Back</h2>
                <p>Login to manage your central game wallet</p>
            </div>
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>UID, Mobile Number or Email</label>
                    <div class="input-wrapper">
                        <input type="text" id="login-identifier" placeholder="Enter UID, mobile or email" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="login-password" placeholder="Enter your password" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Log In</button>
            </form>
            <div class="switch-form-text">
                Don't have an account? <a onclick="toggleForm('register')">Register here</a>
            </div>
        </div>

        <!-- REGISTER BOX -->
        <div id="register-box" class="hidden">
            <div class="brand-header">
                <h2>Create Account</h2>
                <p>Register once, play across all linked games</p>
            </div>
            <form id="register-form" onsubmit="handleRegister(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>First Name</label>
                        <div class="input-wrapper">
                            <input type="text" id="reg-firstname" placeholder="First name" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <div class="input-wrapper">
                            <input type="text" id="reg-lastname" placeholder="Last name">
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Mobile Number</label>
                    <div class="input-wrapper">
                        <input type="tel" id="reg-mobile" placeholder="Enter 10-digit mobile number" pattern="[0-9]{10}" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="reg-email" placeholder="Enter email address">
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="reg-password" placeholder="Create password" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="reg-confirm-password" placeholder="Repeat password" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Referral Code</label>
                    <div class="input-wrapper">
                        <input type="text" id="reg-referral" placeholder="Enter referral code if any">
                    </div>
                </div>
                <button type="submit" class="btn-primary">Register Now</button>
            </form>
            <div class="switch-form-text">
                Already have an account? <a onclick="toggleForm('login')">Login here</a>
            </div>
        </div>
    </div>

    <!-- Elegant Custom Popup -->
    <div id="custom-popup" class="popup-overlay">
        <div class="popup-box">
            <div id="popup-icon-box" class="popup-icon-container"></div>
            <div id="popup-title" class="popup-title">Notification</div>
            <div id="popup-message" class="popup-message">Message details go here.</div>
            <button class="popup-btn" onclick="closePopup()">OK</button>
        </div>
    </div>
            <script>
        //     
        const API_BASE_URL = "https://central-wallet-game-api.onrender.com";

        //          
        function toggleForm(target) {
            const loginBox = document.getElementById('login-box');
            const registerBox = document.getElementById('register-box');
            if (target === 'register') {
                loginBox.classList.add('hidden');
                registerBox.classList.remove('hidden');
            } else {
                registerBox.classList.add('hidden');
                loginBox.classList.remove('hidden');
            }
        }

        //    -   
        function showPopup(type, title, message, callback = null) {
            const popup = document.getElementById('custom-popup');
            const iconBox = document.getElementById('popup-icon-box');
            const titleEl = document.getElementById('popup-title');
            const msgEl = document.getElementById('popup-message');
            
            if(type === 'success') {
                iconBox.innerHTML = '<svg width="44" height="44" viewBox="0 0 24 24" fill="#12b76a"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>';
            } else {
                iconBox.innerHTML = '<svg width="44" height="44" viewBox="0 0 24 24" fill="#f04438"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v7z"/></svg>';
            }
            titleEl.innerText = title;
            msgEl.innerText = message;
            popup.classList.add('active');
            window.popupCallback = callback;
        }

        // -    
        function closePopup() {
            document.getElementById('custom-popup').classList.remove('active');
            if (window.popupCallback) {
                window.popupCallback();
                window.popupCallback = null;
            }
        }

        //  100%       
        async function handleLogin(event) {
            event.preventDefault();
            
            //        
            const identifier = document.getElementById('login-identifier').value;
            const loginPasswordInput = document.getElementById('login-password').value;

            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password: loginPasswordInput })
                });

                const data = await response.json();

                if (data.success) {
                    //        (user  data)   
                    let rawUser = data.user || data.data || data; 
                    if (rawUser && (rawUser.user || rawUser.data)) {
                        rawUser = rawUser.user || rawUser.data;
                    }

                    //    -   
                    const cleanUser = {
                        firstName: rawUser.firstName || rawUser.name || "Parveen", 
                        uid: rawUser.uid || "999278",
                        balance: rawUser.balance !== undefined ? rawUser.balance : 0
                    };

                    //  -        
                    showPopup('success', 'Login Successful', `Welcome back, ${cleanUser.firstName}! Redirecting...`, () => {
                        // 1.       
                        localStorage.setItem('user_data', JSON.stringify(cleanUser));
                        
                        // 2.             
                        localStorage.setItem('wallet_pass_lock', loginPasswordInput);
                        
                        // 3.       
                        window.location.href = "dashboard.html"; 
                    });
                } else {
                    showPopup('error', 'Login Failed', data.message || 'Invalid UID, Mobile or Password.');
                }
            } catch (error) {
                showPopup('error', 'Server Error', 'Could not connect to the server. Please try again later.');
            }
        }

        //       
        async function handleRegister(event) {
            event.preventDefault();
            const firstName = document.getElementById('reg-firstname').value;
            const lastName = document.getElementById('reg-lastname').value;
            const mobile = document.getElementById('reg-mobile').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm-password').value;
            const referralCode = document.getElementById('reg-referral').value;

            if (password !== confirmPassword) {
                showPopup('error', 'Registration Failed', 'Passwords do not match. Please try again.');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ firstName, lastName, mobile, email, password, referralCode })
                });

                const data = await response.json();

                if (data.success) {
                    showPopup('success', 'Account Created', `Congratulations! Your account is ready. Your unique Login UID is: ${data.data.uid}.`, () => {
                        toggleForm('login'); //         
                    });
                } else {
                    showPopup('error', 'Registration Failed', data.message || 'Mobile or Email already exists.');
                }
            } catch (error) {
                showPopup('error', 'Server Error', 'Could not connect to the server.');
            }
        }
    </script>
    
</body>
</html>
